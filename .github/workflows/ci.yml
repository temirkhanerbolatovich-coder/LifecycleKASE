name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  program-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned host Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo +1.98.1 fmt --all -- --check

      - name: Test program logic
        run: cargo +1.98.1 test -p lifecycle_kase --locked

      - name: Lint program
        run: cargo +1.98.1 clippy -p lifecycle_kase --all-targets --locked -- -D warnings

  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run check

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' lifecyclekase-postgres-1)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://lifecycle_kase:local_development_only@127.0.0.1:55432/lifecycle_kase?schema=public
        run: npm run prisma:migrate:deploy

      - name: Test database guards
        run: npm run test:database

      - name: Test API snapshot persistence
        env:
          DATABASE_URL: postgresql://lifecycle_kase:local_development_only@127.0.0.1:55432/lifecycle_kase?schema=public
        run: npm run test:api:database
