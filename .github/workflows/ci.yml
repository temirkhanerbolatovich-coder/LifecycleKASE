name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  secret-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner --ignore-gitleaks-allow'

  program-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned host Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo +1.98.1 fmt --all -- --check

      - name: Test program logic
        run: cargo +1.98.1 test -p lifecycle_kase --locked

      - name: Test Devnet program identity and logic
        run: cargo +1.98.1 test -p lifecycle_kase --locked --features devnet

      - name: Lint program
        run: cargo +1.98.1 clippy -p lifecycle_kase --all-targets --locked -- -D warnings

      - name: Lint Devnet program profile
        run: cargo +1.98.1 clippy -p lifecycle_kase --all-targets --locked --features devnet -- -D warnings

  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PORT: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Run before typecheck/tests can populate workspace dist directories.
      - name: Build web from a clean checkout in deployment order
        run: npm run build:web

      - name: Validate repository
        run: npm run check

      - name: Audit deployed dependency graph
        run: npm audit --omit=dev

      - name: Build deployable workspaces
        run: npm run build

      - name: Test production operator proxy transport
        run: npm run test:web:proxy

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        shell: bash
        run: |
          docker compose up -d postgres
          published_port="$(docker compose port postgres 5432 | head -n 1)"
          published_port="${published_port##*:}"
          if ! [[ "$published_port" =~ ^[0-9]+$ ]]; then
            echo "Could not discover the PostgreSQL host port" >&2
            exit 1
          fi
          echo "DATABASE_URL=postgresql://lifecycle_kase:local_development_only@127.0.0.1:${published_port}/lifecycle_kase?schema=public" >> "$GITHUB_ENV"

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U lifecycle_kase -d lifecycle_kase >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Test database guards
        run: npm run test:database

      - name: Test API snapshot persistence
        run: npm run test:api:database

      - name: Test authenticated registries and instrument drafts
        run: npm run test:registry:database

      - name: Test corporate-action HTTP and database boundaries
        run: npm run test:actions:database
