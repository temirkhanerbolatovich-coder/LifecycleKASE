# Disposable status-only staging. Do not use for investor or financial data.
services:
  - type: web
    name: lifecyclekase-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build --workspace @lifecycle-kase/api && npm run prisma:migrate:deploy
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: AUTH_ENABLED
        value: "false"
      - key: AUTH_DOMAIN
        value: lifecyclekase-web.onrender.com
      - key: AUTH_ALLOWED_ORIGINS
        value: https://lifecyclekase-web.onrender.com
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: lifecyclekase-staging-db
          property: connectionString

  - type: web
    name: lifecyclekase-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build --workspace @lifecycle-kase/web
    startCommand: npm run start:web
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: API_SERVER_URL
        fromService:
          type: web
          name: lifecyclekase-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: lifecyclekase-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: lifecyclekase-staging-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: lifecycle_kase
    user: lifecycle_kase
    ipAllowList: []
